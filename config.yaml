meta:
  version: "0.1.0"
  bot_file: "weex_v167_8_14_DEMO_EXEC.py"

paths:
  data_csv: "weex_15m_v1677.csv"
  runs_dir: "superbot_runs"
  models_dir: "superbot_models"
  logs_dir: "superbot_logs"
  ledger_dir: "superbot_ledger"
  cache_dir: ".superbot_cache"
  bot_file: "weex_v167_8_14_DEMO_EXEC.py"

backtest:
  seed: 42
  deterministic: true
  initial_balance_susdt: 18359.70
  taker_fee_pct: 0.0005
  maker_fee_pct: 0.00015
  slippage_model: "fixed_bps"
  slippage_bps: 1.0
  slippage_atr_fraction: 0.05
  market_fill_price: "next_open"
  funding_enabled: false
  funding_rate_pct_per_8h: 0.0001
  funding_boundaries_utc: [0, 8, 16]
  allow_hedge: false
  allow_pyramiding: false
  max_bars_per_trade: 2000
  min_bars_history: 300

bot_params:
  ENTRY_THRESHOLD: 4
  MIN_EDGE_GAP: 2
  MIN_CONFIDENCE: 55
  TP1_R: 1.40
  TP2_R: 2.30
  TP1_CLOSE_PCT: 0.0
  TP2_CLOSE_PCT: 0.0
  TRAILING_DISTANCE_R: 1.00
  BREAKEVEN_TRIGGER_R: 1.40
  ACCOUNT_RISK_PERCENT: 0.01
  MAX_LEVERAGE: 3
  MAX_MARGIN_UTILIZATION: 0.70
  MAX_NOTIONAL_PCT: 0.70
  MIN_RISK_DISTANCE_PCT: 0.005
  MIN_RISK_DISTANCE_ATR_MULT: 1.50
ml:
  enabled: true
  model_type: "lightgbm"
  policy: "advisory_only"
  label_mode: "binary"
  label_win_threshold_r: 0.30
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  embargo_bars: 20
  wf_enabled: false
  wf_n_splits: 3
  wf_purge_bars: 50
  wf_embargo_bars: 10
  optuna_enabled: false
  optuna_n_trials: 10
  optuna_timeout_seconds: 45
  reject_threshold: 0.35
  reduce_threshold: 0.45
  boost_threshold: 0.70
  fail_safe_allow_on_error: true
  model_path: "superbot_models/run_v3/model.txt"
  metadata_path: "superbot_models/run_v3/model_meta.json"

features:
  require_shift_one: true
  base: []
  derived: []
  optional: []

wfo:
  enabled: true
  train_days: 21
  val_days: 7
  test_days: 7
  step_days: 7
  objective: "sortino_penalized"
  search_space:
    TP1_R:
      low: 1.00
      high: 2.00
      step: 0.20
    TP2_R:
      low: 1.50
      high: 3.00
      step: 0.20
    TRAILING_DISTANCE_R:
      low: 0.50
      high: 1.20
      step: 0.10
    BREAKEVEN_TRIGGER_R:
      low: 1.00
      high: 2.00
      step: 0.20
  frozen:
    - ENTRY_THRESHOLD
    - MIN_EDGE_GAP
    - ACCOUNT_RISK_PERCENT
    - MAX_LEVERAGE
    - MAX_MARGIN_UTILIZATION
    - MAX_NOTIONAL_PCT

reporting:
  format: ["html", "markdown", "parquet"]
  compare_vs_baseline: false

logging:
  level: "INFO"

safety:
  demo_only: true
  real_orders_disabled: true
  never_modify_frozen_logic: true